spring.application.name=secure-task-manager
server.port=8080

# --- MySQL ---
spring.datasource.url=jdbc:mysql://localhost:3306/secure_task_manager?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- JWT ---
# Base64-encoded 256-bit secret. Generate your own with:
#   openssl rand -base64 32
application.security.jwt.secret-key=Zm9vYmFyYmF6cXV4MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3OA==
application.security.jwt.expiration=86400000

# --- CORS ---
application.cors.allowed-origins=http://localhost:3000