spring.application.name=secure-task-manager
server.port=8080

# Optionally load backend/.env (run the app from the backend/ folder).
# Real environment variables also work, so .env is not required.
spring.config.import=optional:file:.env[.properties]

# --- MySQL ---
spring.datasource.url=jdbc:mysql://localhost:3306/secure_task_manager?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# --- JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# --- JWT ---
# Base64-encoded 256-bit secret, provided via environment. Generate one with:
#   openssl rand -base64 32
application.security.jwt.secret-key=${JWT_SECRET_KEY}
application.security.jwt.expiration=${JWT_EXPIRATION:86400000}

# --- CORS ---
application.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
